<main class="wrap"><h1>亲生命性设计</h1>
<p><span class="tag">L1</span><span class="tag">重要</span><span class="tag">理论</span><span class="tag">当代</span><span class="tag">全球</span></p>
<p class="lead">亲生命性设计关注自然光、植物、水与材料质感对人的影响。</p>
<h2>核心概念与定义</h2><p>把自然要素与过程纳入建成环境以支持健康与福祉的设计。</p>
<h2>时间与位置</h2><p>当代、全球（参见来源）。</p>
