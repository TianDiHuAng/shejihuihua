<main class="wrap"><h1>样式主义（手法主义）建筑</h1>
<p><span class="tag">L1</span><span class="tag">重要</span><span class="tag">风格</span><span class="tag">文艺复兴至19世纪</span><span class="tag">欧洲</span></p>
<p class="lead">样式主义在古典规则内制造张力，常被视为从文艺复兴向巴洛克过渡的一环。</p>
