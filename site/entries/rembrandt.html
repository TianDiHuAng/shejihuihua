<main class="wrap"><h1>伦勃朗光</h1>
<p><span class="tag">L1</span><span class="tag">补充</span><span class="tag">理论</span><span class="tag">文艺复兴至19世纪</span><span class="tag">欧洲</span></p>
<p class="lead">它在明暗对比中塑造体积与戏剧感，常用于肖像摄影与绘画。</p>
<h2>核心概念与定义</h2><p>以单侧主光在面部形成三角形亮区、另一侧深暗的人像布光法。</p>
<h2>时间与位置</h2><p>17世纪、欧洲（参见来源）。</p>
