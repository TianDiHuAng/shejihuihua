<main class="wrap"><h1>功能主义建筑</h1>
<p><span class="tag">L1</span><span class="tag">重要</span><span class="tag">风格</span><span class="tag">20世纪</span><span class="tag">全球</span></p>
<p class="lead">它把“是否合用”置于装饰之前，强调空间效率与标准化建造，成为现代建筑的重要推动力。</p>
<h2>核心概念与定义</h2><p>主张以使用需求、结构与材料的技术可能来决定建筑形态，而不是复制历史样式的设计倾向。</p>
<h2>时间与位置</h2><p>20世纪、全球（参见来源）。</p>
