<main class="wrap"><h1>疏散标识（安全出口标识）</h1>
<p><span class="tag">L1</span><span class="tag">补充</span><span class="tag">动线</span><span class="tag">20世纪</span><span class="tag">全球</span></p>
<p class="lead">疏散标识以可见性与照明保障紧急时快速识别出口。</p>
<h2>核心概念与定义</h2><p>标示安全出口方向与位置的疏散标识。</p>
<h2>时间与位置</h2><p>近现代（20 世纪起逐步规范化，参见来源）。</p>
