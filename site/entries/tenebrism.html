<main class="wrap"><h1>暗绘风格（暗色调主义）</h1>
<p><span class="tag">L1</span><span class="tag">补充</span><span class="tag">风格</span><span class="tag">文艺复兴至19世纪</span><span class="tag">欧洲</span></p>
<p class="lead">暗绘风格是明暗法的极端化，营造神秘与戏剧张力。</p>
<h2>核心概念与定义</h2><p>把背景压到极暗、以强烈聚光突出主体的绘画风格。</p>
<h2>时间与位置</h2><p>17世纪、欧洲（参见来源）。</p>
